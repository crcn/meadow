services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning"]
      interval: 5s
      timeout: 5s
      retries: 5

  memgraph:
    image: memgraph/memgraph-mage:latest
    ports:
      - "7687:7687"   # Bolt protocol
      - "7444:7444"   # Log streaming
    volumes:
      - memgraph_data:/var/lib/memgraph
    environment:
      MEMGRAPH_USER: memgraph
      MEMGRAPH_PASSWORD: memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  memgraph-lab:
    image: memgraph/lab:latest
    ports:
      - "3001:3000"
    depends_on:
      memgraph:
        condition: service_healthy
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: 7687

  learning-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://learning:learning@postgres:5432/learning
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: memgraph
      MEMGRAPH_PASSWORD: memgraph
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      RUST_LOG: info,learning_server=debug,learning_core=debug
      DOCKER_ENV: "1"
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_ISSUER: ${JWT_ISSUER:-ourmeadow}
      ADMIN_IDENTIFIERS: ${ADMIN_IDENTIFIERS:-}
      TEST_IDENTIFIER_ENABLED: ${TEST_IDENTIFIER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    volumes:
      - ./:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target

volumes:
  postgres_data:
  memgraph_data:
  cargo_cache:
  target_cache:
